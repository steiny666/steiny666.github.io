<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    /* Hinweisleiste oben */
    .topbar {
      background: #111;
      color: #fff;
      font-size: 0.8rem;
      text-align: center;
      padding: 0.4rem 1rem;
      letter-spacing: 0.05em;
    }
    .topbar a { color: #fff; }

    /* Hauptheader */
    .header {
      position: sticky;
      top: 0;
      background: #f4f4f4;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      z-index: 10;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: #111;
    }

    .nav {
      display: flex;
      gap: 2rem;
    }
    .nav a {
      color: #111;
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .nav a:hover { text-decoration: underline; }

    .login {
      color: #111;
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid #111;
      padding: 0.4rem 0.9rem;
    }
    .login:hover { background: #111; color: #fff; }

    /* Inhalt */
    main {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }

    /* Smartphone */
    @media (max-width: 700px) {
      .header { flex-wrap: wrap; gap: 1rem; }
      .nav { gap: 1rem; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    Neuigkeiten jetzt entdecken — <a href="#">Mehr erfahren</a>
  </div>

  <header class="header">
    <a href="#" class="logo">MEIN LOGO</a>

    <nav class="nav">
      <a href="#">Projekte</a>
      <a href="#">Blog</a>
      <a href="#">Über mich</a>
      <a href="#">Kontakt</a>
    </nav>

    <a href="#" class="login">Login</a>
  </header>

  <main>
    <h1>Willkommen</h1>
    <p>Hier steht dein Inhalt.</p>
  </main>

</body>
</html>
